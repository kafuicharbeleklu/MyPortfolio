    <!-- Applies the saved theme before first paint, so the page never flashes the wrong colours.
         Same storage key as src/site/theme.ts. -->
    <script>
      try {
        if (localStorage.getItem('portfolio_theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#e9e0d2');
        }
      } catch (error) {
        /* storage unavailable: the default dark theme stays */
      }
    </script>
    <style>
      html {
        background: #e9e0d2;
      }
      html[data-theme='dark'] {
        background: #1c1d1f;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
